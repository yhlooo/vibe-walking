# goreleaser 配置
# 参考 https://goreleaser.com

version: 2

# 为支持的系统和架构构建独立可执行文件，并注入版本号。
builds:
  - id: vibe-walking-bin
    binary: vibe-walking
    main: "./cmd/vibe-walking"
    env:
      - "CGO_ENABLED=0"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-X github.com/yhlooo/vibe-walking/internal/version.Version={{ .Version }}"
      - "-w"

# 归档名称与安装脚本一致，Windows 使用 ZIP。
archives:
  - formats: ["tar.gz"]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

# 汇总发布归档的校验值。
checksum:
  name_template: "checksums.txt"

# 使用 Linux 二进制生成两个平台的容器镜像。
dockers_v2:
  - id: vibe-walking-image
    dockerfile: goreleaser.dockerfile
    ids:
      - vibe-walking-bin
    images:
      - "ghcr.io/yhlooo/vibe-walking"
    tags:
      - "v{{ .Version }}"
      - "latest"
    annotations:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.source": "https://github.com/yhlooo/vibe-walking.git"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
    platforms:
      - linux/amd64
      - linux/arm64

# 按提交顺序生成发布日志，并过滤维护性提交。
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^style:"
      - "^chore:"
